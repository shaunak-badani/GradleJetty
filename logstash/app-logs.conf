# Tails logs/application.log and ships each JSON line into OpenSearch's
# "app-logs" index - this is the piece that replaced the direct
# OpenSearchClient.index() call that used to live in LogIngestServlet.
#
# Run with: bin/logstash -f app-logs.conf
# Requires the logstash-output-opensearch plugin:
#   bin/logstash-plugin install logstash-output-opensearch

input {
  file {
    path => "/home/shaunak/NetSuite/Applications/GradleJetty/logs/application.log"
    start_position => "beginning"
    ecs_compatibility => "disabled"
  }
}

filter {
  # Each raw line lands in the default "message" field as plain text; parse
  # it as JSON and merge the result into the event (overwriting "message"
  # with our own message field, since the inner JSON has one too).
  json {
    source => "message"
  }

  # Drop Logstash's own bookkeeping fields so the indexed document stays
  # exactly {timestamp, level, message, source} - the shape LogSearchServlet
  # deserializes into LogEntry.
  mutate {
    remove_field => ["@version", "@timestamp", "path", "host", "event"]
  }
}

output {
  opensearch {
    hosts => ["http://localhost:9200"]
    index => "app-logs"
  }
}
